[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iqaevaluator"
dynamic = ["version"]
description = 'A Python framework for comprehensive quality assessment of 2D images and 3D volumes. Designed for medical imaging and materials science, it bundles standard, specific, and novel metrics for segmentation as well as full- and no-reference analyses.'
readme = "README.md"
requires-python = ">=3.8"
license = {text="MIT"}
keywords = []
authors = [
  { name = "glebjan", email = "" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
