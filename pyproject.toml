[project.urls]
Documentation = "https://github.com/genizki/iqaevaluator#readme"
Issues = "https://github.com/genizki/iqaevaluator/issues"
Source = "https://github.com/genizki/iqaevaluator"

[project.optional-dependencies]
# Official reference implementations used only by tests/calibration/ (spec D8).
calibration = [
  "surface-distance==0.1",   # DeepMind's own PyPI upload; Nikolov et al. — NSD (author implementation), HD, ASSD (area-weighted variant)
  "medpy==0.5.2",            # Dice, HD, HD95 (concatenated variant), ASSD (voxel variant); sdist only, builds on Python 3.14
  "panopticapi @ git+https://github.com/cocodataset/panopticapi.git@7bb4655548f98f3fedc07bf37e9040a992b054b0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "src/iqaevaluator/__about__.py"

# Keep the sdist to sources: without an explicit selection hatchling ships the
# whole working tree, and this one holds .venv/, models/ and report/
# (a 2.6 GB tarball). The wheel is package-only by default and needs no rule.
# Patterns are anchored (leading "/") because hatchling's include spec is an
# unanchored gitignore-style glob: an unanchored "src/" or "README.md" also
# matches nested directories/files of that name anywhere in the tree (e.g.
# .venv-calibration/.../numpy/f2py/tests/src/... or models/dreamsim/*/README.md),
# and only a directory literally named ".venv" is hardcoded-excluded by hatchling
# — ".venv-calibration" is not.
[tool.hatch.build.targets.sdist]
include = [
  "/src/",
  "/docs/",
  "/README.md",
  "/pyproject.toml",
]

# Hatch's default environment IS the project-local .venv/, so `hatch run ...`
# and `source .venv/bin/activate` operate on the same interpreter. That venv is
# built by uv and ships no pip, hence the uv installer.
[tool.hatch.envs.default]
path = ".venv"
installer = "uv"

[tool.hatch.envs.default.scripts]
evaluate = "python src/main.py {args}"

# Development happens here. The runtime env (.venv) stays free of our own dev
# pins so that `hatch env create` proves the package installs without them
# (pyiqa still pulls pytest/ruff/pre-commit/yapf transitively — not ours to fix).
[tool.hatch.envs.calibration]
path = ".venv-calibration"
installer = "uv"
features = ["calibration"]
dependencies = [
  "pytest==9.1.1",
  "ruff==0.16.6",
  "pre_commit==4.6.2",
  "yapf==0.43.0",
]

[tool.hatch.envs.calibration.scripts]
test = "pytest {args:tests}"
report = "python tests/calibration/report.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/iqaevaluator tests}"

[tool.coverage.run]
source_pkgs = ["iqaevaluator", "tests"]
branch = true
parallel = true
omit = [
  "src/iqaevaluator/__about__.py",
]

[tool.coverage.paths]
iqaevaluator = ["src/iqaevaluator", "*/iqaevaluator/src/iqaevaluator"]
tests = ["tests", "*/iqaevaluator/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
